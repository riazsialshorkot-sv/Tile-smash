name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permissions
        run: |
          find . -name "gradlew" -exec chmod +x {} + || true
          chmod +x ./gradlew || true
          if [ -d "android" ]; then
            chmod +x ./android/gradlew || true
          fi

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            echo "Navigating to ./android directory and running assembleDebug..."
            cd android
            ./gradlew assembleDebug --stacktrace --no-daemon
          elif [ -f "./gradlew" ]; then
            echo "Running assembleDebug from root directory..."
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            GRADLEW_FILE=$(find . -name "gradlew" -print -quit)
            if [ -n "$GRADLEW_FILE" ]; then
              echo "Found gradlew at $GRADLEW_FILE"
              cd "$(dirname "$GRADLEW_FILE")"
              ./gradlew assembleDebug --stacktrace --no-daemon
            else
              echo "ERROR: Could not find gradlew. Initializing wrapper..."
              gradle wrapper
              ./gradlew assembleDebug --stacktrace --no-daemon
            fi
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileSmash-Debug-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 14
